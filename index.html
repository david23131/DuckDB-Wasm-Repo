<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS MARCO Search</title></head>
<body>
<main>
<h1>MS MARCO Search</h1>
<p>Search 8.8 million passages in your browser.</p>
<section aria-labelledby="setup-heading">
<h2 id="setup-heading">Open the search index</h2>
<p>First visit? Download the index once (3.35 GB). It stays in this browser’s storage. On later visits, reopen the saved index.</p>
<button id="marco-fetch" type="button" disabled>Download & open index (3.35 GB)</button>
<button id="marco-reopen" type="button" disabled>Reopen saved index</button>
<button id="marco-cancel-download" type="button" disabled hidden>Cancel download</button>
<progress id="marco-progress" max="100" value="0" hidden aria-label="Index download progress"></progress>
</section>
<form id="marco-form">
<label for="marco-query">Search MS MARCO passages</label>
<input id="marco-query" type="search" placeholder="Search" required maxlength="500">
<button id="marco-search" disabled>Search</button>
</form>
<p id="marco-status" role="status">Download or reopen the index to start searching.</p>
<ol id="marco-results" aria-label="Search results"></ol>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
